<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>DarasaOne: Ayah Quest</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-teal: #0D7377;
            --primary-gold: #F4A261;
            --soft-cream: #FAF3E0;
            --warm-beige: #EABF9F;
            --emerald: #2A9D8F;
            --deep-purple: #6A4C93;
            --text-dark: #1A1A1A;
            --transition-fast: 150ms;
            --transition-normal: 300ms;
            --transition-slow: 500ms;
            --ease-out: cubic-bezier(0.0, 0, 0.2, 1);
            --ease-bounce: cubic-bezier(0.68, -0.6, 0.32, 1.6);
            --space-xs: 8px;
            --space-sm: 16px;
            --space-md: 24px;
            --space-lg: 32px;
            --space-xl: 48px;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            -ms-touch-action: none;
            font-family: 'Inter', sans-serif;
        }

        #game-world {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(160deg, #0a4f52 0%, #0D7377 30%, #2A9D8F 60%, #1a6b6e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            isolation: isolate;
        }

        /* The generated Islamic pattern is kept calm behind the learning surface. */
        #game-world.art-background {
            background-color: #FAF3E0;
            background-repeat: repeat;
            background-size: 640px 640px;
            background-position: center top;
        }

        #game-world.art-background::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            background: linear-gradient(160deg, rgba(250,243,224,0.18), rgba(13,115,119,0.22));
            pointer-events: none;
        }

        .art-background .header-bar,
        .art-background .verse-container,
        .art-background .tiles-area,
        .art-background .mistakes-counter {
            position: relative;
            z-index: 1;
        }

        .art-background .game-title {
            color: #F4A261;
            text-shadow: 0 2px 5px rgba(13,115,119,0.75), 0 0 18px rgba(250,243,224,0.45);
        }

        .art-background .verse-ref {
            color: #FAF3E0;
            text-shadow: 0 1px 4px rgba(13,115,119,0.8);
        }

        .art-background .verse-display {
            background: linear-gradient(145deg, rgba(7,76,79,0.90), rgba(13,115,119,0.82));
            border-color: rgba(244,162,97,0.55);
            box-shadow: 0 10px 34px rgba(6,57,60,0.34), inset 0 1px 0 rgba(250,243,224,0.18);
        }

        .art-background .mistakes-counter {
            color: #FAF3E0;
            text-shadow: 0 1px 4px rgba(13,115,119,0.7);
        }

        .header-bar {
            width: 100%;
            padding: 16px 24px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }

        .game-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-gold);
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
            letter-spacing: 1px;
            direction: ltr;
        }

        .verse-ref {
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            color: rgba(255,255,255,0.85);
            direction: ltr;
        }

        .verse-container {
            flex: 1;
            width: 100%;
            max-width: 680px;
            padding: 16px 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .verse-display {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            direction: rtl;
            line-height: 2.2;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            min-height: 200px;
        }

        /* Arabic is rendered with a Quran-friendly Naskh font. A completed ayah is
           reflowed into one text run so the browser can apply joining and ligatures
           exactly as it does in continuous Mushaf text. */
        .verse-display.quran-display {
            font-family: 'Noto Naskh Arabic', 'Amiri', 'Times New Roman', serif;
            font-variant-ligatures: contextual common-ligatures;
            font-feature-settings: "calt" 1, "rlig" 1, "liga" 1;
            line-height: 2.7;
        }

        .verse-char {
            font-size: 36px;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.2);
            display: inline;
        }

        .verse-display.quran-display .verse-char,
        .verse-display.quran-display .slot-letter,
        .success-verse,
        .joined-ayah {
            font-family: 'Noto Naskh Arabic', 'Amiri', 'Times New Roman', serif;
            font-variant-ligatures: contextual common-ligatures;
            font-feature-settings: "calt" 1, "rlig" 1, "liga" 1;
        }

        .verse-display.fully-joined {
            display: block;
            padding: 40px 32px;
        }

        .joined-ayah {
            display: block;
            width: 100%;
            color: #fff;
            font-size: clamp(38px, 6vw, 54px);
            line-height: 2.1;
            text-align: center;
            direction: rtl;
            unicode-bidi: plaintext;
            white-space: normal;
            text-shadow: 0 1px 5px rgba(0,0,0,0.24);
        }

        .verse-space { 
            width: 12px;
            display: inline-block;
        }

        .slot {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border: 2px dashed rgba(244,162,97,0.7);
            border-radius: 12px;
            background: rgba(244,162,97,0.1);
            transition: all var(--transition-normal) var(--ease-out);
            position: relative;
            vertical-align: middle;
            margin: 0 2px;
        }

        .slot.hover-active {
            border-color: var(--primary-gold);
            background: rgba(244,162,97,0.25);
            transform: scale(1.08);
            box-shadow: 0 0 16px rgba(244,162,97,0.4);
        }

        .slot.filled {
            border-style: solid;
            border-color: rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.15);
        }

        .slot.correct {
            border-color: var(--primary-gold);
            background: rgba(244,162,97,0.2);
            box-shadow: 0 0 20px rgba(244,162,97,0.5), 0 0 40px rgba(244,162,97,0.2);
            animation: correctGlow 0.6s var(--ease-out);
        }

        .slot .slot-letter {
            font-size: 32px;
            color: #fff;
            pointer-events: none;
        }

        @keyframes correctGlow {
            0% { transform: scale(1); }
            30% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes shakeSlot {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(4px); }
        }

        .slot.incorrect {
            animation: shakeSlot 0.4s ease;
            border-color: #e74c3c;
            background: rgba(231,76,60,0.15);
        }

        .tiles-area {
            width: 100%;
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            min-height: 200px;
            padding-bottom: 40px;
        }

        .letter-tile {
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-gold) 0%, #e8924a 100%);
            border-radius: 16px;
            font-size: 40px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            cursor: grab;
            touch-action: none;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.3);
            transition: transform var(--transition-fast) var(--ease-out), opacity var(--transition-fast), box-shadow var(--transition-fast);
            position: relative;
            z-index: 5;
        }

        .letter-tile:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
        }

        .letter-tile:active, .letter-tile.dragging {
            cursor: grabbing;
            transform: scale(1.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
            z-index: 100;
        }

        .letter-tile.placed {
            opacity: 0.3;
            pointer-events: none;
            transform: scale(0.9);
        }

        .letter-tile.drag-ghost {
            position: fixed;
            z-index: 1000;
            pointer-events: none;
            transform: scale(1.15);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
            opacity: 0.95;
        }

        /* Real calligraphic tile art replaces the old color-only tile treatment. */
        .letter-tile.art-backed {
            background-color: #FAF3E0;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            border: 1px solid rgba(244,162,97,0.85);
            color: transparent;
            text-shadow: none;
            box-shadow: 0 5px 16px rgba(7,76,79,0.32), 0 0 0 1px rgba(250,243,224,0.24) inset;
        }

        .slot .slot-letter.art-backed {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            color: transparent;
            text-shadow: none;
        }

        .art-background .tiles-area {
            filter: drop-shadow(0 5px 12px rgba(7,76,79,0.16));
        }

        .success-overlay {
            background: linear-gradient(145deg, rgba(7,76,79,0.94), rgba(13,115,119,0.92));
            position: absolute;
            inset: 0;
            background: rgba(13,115,119,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-slow) var(--ease-out);
        }

        .success-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .success-text {
            font-family: 'Fredoka', sans-serif;
            font-size: 48px;
            color: var(--primary-gold);
            text-shadow: 0 2px 12px rgba(0,0,0,0.3);
            margin-bottom: 16px;
        }

        .success-verse {
            font-size: 32px;
            color: #fff;
            text-align: center;
            padding: 0 32px;
            direction: rtl;
            line-height: 1.8;
            margin-bottom: 32px;
        }

        .next-btn {
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            min-width: 220px;
            min-height: 96px;
            padding: 16px 48px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, var(--primary-gold) 0%, #e8924a 100%);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            transition: transform var(--transition-fast) var(--ease-out);
            pointer-events: auto;
        }

        .next-btn:hover { transform: translateY(-2px); }
        .next-btn:active { transform: scale(0.97); }

        .completion-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            direction: ltr;
        }

        .achievement-overlay-btn {
            background: linear-gradient(135deg, #2A9D8F 0%, #0D7377 100%);
            border: 1px solid rgba(250,243,224,0.45);
        }

        .stars-display {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .star {
            font-size: 48px;
            opacity: 0.3;
            transition: all var(--transition-normal) var(--ease-bounce);
        }
        .star.earned {
            opacity: 1;
            text-shadow: 0 0 16px rgba(244,162,97,0.6);
        }

        .mistakes-counter {
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            color: rgba(255,255,255,0.7);
            position: absolute;
            top: 100px;
            right: 24px;
            direction: ltr;
        }

        .audio-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
            direction: ltr;
        }

        .audio-toggle {
            min-width: 112px;
            min-height: 96px;
            padding: 12px 16px;
            border-radius: 18px;
            border: 1px solid rgba(244,162,97,0.55);
            background: rgba(7,76,79,0.72);
            color: #FAF3E0;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 16px rgba(0,0,0,0.2);
            transition: transform var(--transition-fast) var(--ease-out), background var(--transition-fast) var(--ease-out);
        }

        .audio-toggle:hover { transform: translateY(-2px); background: rgba(7,76,79,0.88); }
        .audio-toggle:active { transform: scale(0.97); }
        .audio-toggle.muted { color: rgba(250,243,224,0.68); border-color: rgba(250,243,224,0.28); }

        .slot.hint-pulse {
            animation: hintPulse 0.7s var(--ease-out);
        }

        @keyframes hintPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(244,162,97,0); }
            45% { transform: scale(1.12); box-shadow: 0 0 24px rgba(244,162,97,0.65); }
        }

        .achievement-btn {
            position: absolute;
            top: 164px;
            left: 24px;
            z-index: 10;
            min-width: 188px;
            min-height: 88px;
            padding: 10px 16px;
            border-radius: 14px;
            border: 1px solid rgba(244,162,97,0.58);
            background: rgba(7,76,79,0.76);
            color: #FAF3E0;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 16px rgba(0,0,0,0.22);
            transition: transform var(--transition-fast) var(--ease-out), background var(--transition-fast) var(--ease-out);
            direction: ltr;
        }

        .achievement-btn:hover { transform: translateY(-2px); background: rgba(7,76,79,0.9); }
        .achievement-btn:active { transform: scale(0.97); }

        .progress-btn {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            min-height: 56px;
            color: rgba(255,255,255,0.85);
            position: absolute;
            top: 100px;
            left: 24px;
            direction: ltr;
            padding: 8px 16px;
            border-radius: 12px;
            background: rgba(244,162,97,0.2);
            border: 1px solid rgba(244,162,97,0.4);
            cursor: pointer;
            transition: all var(--transition-fast) var(--ease-out);
        }

        .progress-btn:hover {
            background: rgba(244,162,97,0.3);
            transform: translateY(-2px);
        }

        .progress-modal {
            position: absolute;
            inset: 0;
            background: rgba(7,76,79,0.94);
            backdrop-filter: blur(8px);
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 24px;
            overflow-y: auto;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-normal) var(--ease-out);
        }

        .progress-modal.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* Shareable achievement card screen */
        .achievement-modal {
            position: absolute;
            inset: 0;
            z-index: 80;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            overflow-y: auto;
            background: rgba(4,39,41,0.96);
            backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-slow) var(--ease-out);
        }

        .achievement-modal.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .achievement-stage {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 18px;
        }

        .achievement-card {
            --card-ink: #FAF3E0;
            --card-muted: rgba(250,243,224,0.76);
            --card-panel: rgba(7,76,79,0.76);
            --card-accent: #F4A261;
            position: relative;
            width: min(100%, 620px);
            aspect-ratio: 720 / 1000;
            min-height: 0;
            overflow: hidden;
            border-radius: 28px;
            box-sizing: border-box;
            padding: 62px 48px 44px;
            text-align: center;
            color: var(--card-ink);
            background: linear-gradient(145deg, #0a4f52, #0D7377 58%, #e8c28d);
            border: 2px solid rgba(244,162,97,0.8);
            box-shadow: 0 24px 70px rgba(0,0,0,0.42), 0 0 0 8px rgba(244,162,97,0.08);
            transform: translateY(28px) scale(0.96);
            transition: transform var(--transition-slow) var(--ease-bounce);
            isolation: isolate;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .achievement-modal.visible .achievement-card {
            transform: translateY(0) scale(1);
        }

        .achievement-card::before,
        .achievement-card::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .achievement-card::before {
            z-index: -1;
            opacity: 0.2;
            background-image: repeating-conic-gradient(from 45deg, rgba(244,162,97,0.7) 0deg 7deg, transparent 7deg 15deg);
            background-size: 96px 96px;
            mix-blend-mode: screen;
        }

        .achievement-card::after {
            z-index: -1;
            background: var(--card-tint, rgba(7,76,79,0.08));
            mix-blend-mode: multiply;
        }

        .achievement-card.pattern-lattice::before {
            opacity: 0.18;
            background-image: linear-gradient(45deg, rgba(244,162,97,0.8) 1px, transparent 1px), linear-gradient(-45deg, rgba(250,243,224,0.45) 1px, transparent 1px);
            background-size: 48px 48px;
        }

        .achievement-card.pattern-arabesque::before {
            opacity: 0.2;
            background-image: radial-gradient(circle at 50% 0%, transparent 0 17px, rgba(244,162,97,0.62) 18px 20px, transparent 21px 34px);
            background-size: 68px 68px;
        }

        .achievement-card.scheme-midnight-gold {
            --card-ink: #FFF7E8;
            --card-muted: rgba(255,247,232,0.76);
            --card-panel: rgba(20,31,52,0.8);
            --card-accent: #F4A261;
            --card-tint: rgba(18,27,49,0.32);
        }

        .achievement-card.scheme-cream-teal {
            --card-ink: #0B4F52;
            --card-muted: rgba(11,79,82,0.72);
            --card-panel: rgba(250,243,224,0.84);
            --card-accent: #0D7377;
            --card-tint: rgba(250,243,224,0.3);
        }

        .achievement-card.scheme-teal-gold {
            --card-tint: rgba(7,76,79,0.08);
        }

        .achievement-card > * {
            position: relative;
            z-index: 1;
        }

        .achievement-kicker {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--card-accent);
            direction: ltr;
        }

        .achievement-title {
            margin: 12px 0 4px;
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(38px, 7vw, 58px);
            line-height: 1.05;
            color: var(--card-ink);
            text-shadow: 0 2px 12px rgba(0,0,0,0.22);
        }

        .branding-top .achievement-title { margin-top: 76px; }

        .achievement-subtitle {
            margin: 0 0 22px;
            color: var(--card-muted);
            font-size: 18px;
            direction: ltr;
        }

        .achievement-seal {
            width: 74px;
            height: 74px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px solid var(--card-accent);
            color: var(--card-accent);
            font-size: 34px;
            background: rgba(7,76,79,0.28);
            box-shadow: 0 0 0 7px rgba(244,162,97,0.12), 0 0 28px rgba(244,162,97,0.24);
        }

        .achievement-stats {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            padding: 16px;
            border: 1px solid rgba(244,162,97,0.45);
            border-radius: 20px;
            background: var(--card-panel);
            backdrop-filter: blur(5px);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
        }

        .achievement-stat {
            min-height: 92px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 14px;
            background: rgba(255,255,255,0.09);
        }

        .achievement-stat-value {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(28px, 5vw, 42px);
            line-height: 1;
            color: var(--card-accent);
            direction: ltr;
        }

        .achievement-stat-label {
            margin-top: 8px;
            color: var(--card-muted);
            font-size: 13px;
            font-weight: 600;
            direction: ltr;
        }

        .achievement-progress-label {
            display: flex;
            justify-content: space-between;
            margin: 20px 4px 8px;
            color: var(--card-muted);
            font-size: 13px;
            direction: ltr;
        }

        .achievement-progress-track {
            height: 12px;
            overflow: hidden;
            border-radius: 99px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(244,162,97,0.38);
        }

        .achievement-progress-fill {

        // --- Build DOM ---

        // Verse display

        function getArabicAyahNumber() {
            const explicitNumber = currentVerseData.ayahNumber || currentVerseData.number;
            const match = String(verseRef).match(/:(\d+)\)?\s*$/);
            const number = explicitNumber || (match ? match[1] : '');
            const digits = '٠١٢٣٤٥٦٧٨٩';
            return String(number).split('').map((digit) => /\d/.test(digit) ? digits[Number(digit)] : digit).join('');
        }

        // Keep the complete Uthmani grapheme, including its harakah, in a slot.
        // Artwork is intentionally bypassed for marked letters so no tanween,
        // fatha, damma, kasra, shaddah, sukun, or Quranic annotation is lost.
        function getBaseArabicLetter(grapheme) {
            return grapheme.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u08D3-\u08FF]/gu, '');
        }

        function createAyahMarker() {
            const marker = document.createElement('span');

        // Build verse with slots
        function buildVerse() {
            verseDisplay.innerHTML = '';
            slots = [];
            verseDisplay.classList.toggle('quran-display', quranSettings.joinLetters);
            verseDisplay.classList.toggle('standard-script', quranSettings.script === 'standard');
            verseDisplay.classList.remove('fully-joined');

            for (let i = 0; i < chars.length; i++) {
                if (/^\\s+$/.test(chars[i])) {
                    const sp = document.createElement('span');
                    sp.className = 'verse-space';
                    sp.textContent = ' ';
                    verseDisplay.appendChild(sp);
                } else if (missingSet.has(i)) {
                    const slot = document.createElement('div');
                    slot.className = 'slot';
                    slot.style.width = slotSize + 'px';
                    slot.style.height = slotSize + 'px';
                    slot.dataset.slotIndex = slots.length;

                    const slotData = {
                        index: i,
                        correctChar: chars[i],
                        filledChar: null,
                        filledTileId: null,
                        element: slot,
                        correct: false
                    };
                    slots.push(slotData);
                    slot.setAttribute('aria-label', `Tap to hear the letter hint for ${chars[i]}`);
                    slot.addEventListener('click', () => {
                        if (mode !== 'play' || slotData.correct) return;
                        slot.classList.remove('hint-pulse');
                        void slot.offsetWidth;
                        slot.classList.add('hint-pulse');
                        playLetterHint(slotData.correctChar);
                    });
                    verseDisplay.appendChild(slot);
                } else {
                    const ch = document.createElement('span');
                    ch.className = 'verse-char';
                    ch.textContent = chars[i];
                        verseDisplay.appendChild(ch);
                }
            }
            verseDisplay.appendChild(createAyahMarker());
        }

        function showFullyJoinedAyah() {
            if (!quranSettings.joinLetters) return;
            verseDisplay.innerHTML = '';
            verseDisplay.classList.add('quran-display', 'fully-joined');
            const joinedAyah = document.createElement('span');
            joinedAyah.className = 'joined-ayah';
            joinedAyah.appendChild(document.createTextNode(verseText));
            joinedAyah.appendChild(createAyahMarker());
            verseDisplay.appendChild(joinedAyah);
        }

        buildVerse();

        // Letter tiles area
        const tilesArea = document.createElement('div');
        tilesArea.className = 'tiles-area';
        gameWorld.appendChild(tilesArea);

        // Collect missing letters and add some distractors
        function buildTiles() {
            tilesArea.innerHTML = '';
            tiles = [];

            const correctLetters = missingIndices.map(i => chars[i]);
            // Add 2 distractor Arabic letters
            const distractors = ['ع', 'ص', 'ق', 'ث', 'ذ', 'ض', 'ظ', 'غ'];
            const extraCount = Math.min(2, Math.max(0, 6 - correctLetters.length));
            const shuffledDistractors = distractors.sort(() => Math.random() - 0.5);
            const allLetters = [...correctLetters];
            for (let i = 0; i < extraCount; i++) {
                if (!allLetters.includes(shuffledDistractors[i])) {
                    allLetters.push(shuffledDistractors[i]);
                }
            }

            // Shuffle
            const shuffled = allLetters.sort(() => Math.random() - 0.5);

            shuffled.forEach((ch, idx) => {
                const tile = document.createElement('div');
                tile.className = 'letter-tile';
                tile.dataset.tileId = idx;
                applyLetterArtwork(tile, ch);

                const tileData = {
                    id: idx,
                    char: ch,
                    placed: false,
                    element: tile
                };
                tiles.push(tileData);
                tilesArea.appendChild(tile);
            });
        }

        buildTiles();

        // Success overlay
        const successOverlay = document.createElement('div');

        // Progress and achievement screens

        gameWorld.appendChild(achievementModal);
        let achievementReturnToCompletion = false;

        function getAccuracyPercentage() {
            const totalAttempts = playerProgress.totalCorrectPlacements + playerProgress.totalIncorrectPlacements;
            return totalAttempts > 0 ? Math.round((playerProgress.totalCorrectPlacements / totalAttempts) * 100) : 100;
        }

        function getAchievementLevel() {
            const completed = playerProgress.totalVersesCompleted;
            if (completed >= versesArray.length && versesArray.length > 0) return 'Master';
            if (completed >= 6) return 'Advanced';

            return 'Beginner';
        }

                }

        function showAchievementCard(returnToCompletion = false) {

            const completionPercentage = Math.round((playerProgress.totalVersesCompleted / versesArray.length) * 100);
            const level = getAchievementLevel();
            const cardBackground = assetCache.achievement_card_background;

        function showProgressModal() {
            const completionPercentage = Math.round((playerProgress.totalVersesCompleted / versesArray.length) * 100);
            const accuracy = getAccuracyPercentage();
            
            progressModal.innerHTML = `
                <div class="progress-header">Your Learning Journey</div>

            `;
            
            progressModal.classList.add('visible');
            
            document.getElementById('close-progress-btn').addEventListener('click', () => {

            const viewAchievementFromProgress = document.getElementById('view-achievement-from-progress');
            if (viewAchievementFromProgress) {

                    progressModal.classList.remove('visible');
                    showAchievementCard();
                });

            const resetBtn = document.getElementById('reset-progress-btn');
            if (resetBtn) {

                    // Create confirmation overlay
                    const confirmOverlay = document.createElement('div');

                                    padding: 32px; border-radius: 20px; text-align: center; max-width: 400px;
                                    border: 2px solid rgba(244,162,97,0.4);">
                            <div style="font-size: 24px; color: var(--primary-gold); margin-bottom: 16px; font-family: 'Fredoka', sans-serif;">
                                Reset Progress?
                            </div>
                            <div style="font-size: 16px; color: rgba(255,255,255,0.8); margin-bottom: 24px; line-height: 1.5;">
                                This will erase all your completed verses, star ratings, and achievement statistics. This cannot be undone.

        // --- Drag and Drop ---
        let ghostEl = null;

        function getSlotAtPoint(x, y) {
            for (const s of slots) {
                const rect = s.element.getBoundingClientRect();
                if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                    return s;
                }
            }
            return null;
        }

        function startDrag(tileData, startX, startY) {
            if (mode === 'edit' || gameComplete) return;
            if (tileData.placed) return;

            dragState = { tileData, startX, startY };
            tileData.element.classList.add('dragging');

            // Create ghost
            ghostEl = document.createElement('div');
            ghostEl.className = 'letter-tile drag-ghost';
            applyLetterArtwork(ghostEl, tileData.char);
            ghostEl.style.left = (startX - 48) + 'px';
            ghostEl.style.top = (startY - 48) + 'px';
            document.body.appendChild(ghostEl);

            tileData.element.style.opacity = '0.4';
        }

        function moveDrag(x, y) {
            if (!dragState || !ghostEl) return;

            ghostEl.style.left = (x - 48) + 'px';
            ghostEl.style.top = (y - 48) + 'px';

            // Highlight slot under cursor
            slots.forEach(s => {
                if (!s.correct) s.element.classList.remove('hover-active');
            });
            const hoverSlot = getSlotAtPoint(x, y);
            if (hoverSlot && !hoverSlot.correct) {
                hoverSlot.element.classList.add('hover-active');
            }
        }

        function endDrag(x, y) {
            if (!dragState) return;

            const { tileData } = dragState;
            tileData.element.classList.remove('dragging');
            tileData.element.style.opacity = '';

            // Clean up ghost
            if (ghostEl) {
                ghostEl.remove();
                ghostEl = null;
            }

            // Remove hover states
            slots.forEach(s => s.element.classList.remove('hover-active'));

            const targetSlot = getSlotAtPoint(x, y);

            if (targetSlot && !targetSlot.correct) {
                playDropSound();

                // Remove any previously placed tile in this slot
                if (targetSlot.filledTileId !== null) {
                    const prevTile = tiles.find(t => t.id === targetSlot.filledTileId);
                    if (prevTile) {
                        prevTile.placed = false;
                        prevTile.element.classList.remove('placed');
                    }
                }

                if (tileData.char === targetSlot.correctChar) {
                    // Correct!
                    targetSlot.correct = true;
                    targetSlot.filledChar = tileData.char;
                    targetSlot.filledTileId = tileData.id;
                    tileData.placed = true;
                    tileData.element.classList.add('placed');

                    targetSlot.element.classList.remove('filled', 'incorrect');
                    targetSlot.element.classList.add('correct');
                    targetSlot.element.innerHTML = '';
                    const slotLetter = document.createElement('span');
                    slotLetter.className = 'slot-letter';
                    // Keep the ayah surface typographic like a Mushaf; illustrated tiles stay in the tray only.
                    if (quranSettings.joinLetters || /[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u08D3-\u08FF]/u.test(tileData.char)) {
                        slotLetter.textContent = tileData.char;
                        slotLetter.setAttribute('aria-label', `Arabic letter ${tileData.char}`);
                    } else {
                        applyLetterArtwork(slotLetter, tileData.char);
                    }
                    targetSlot.element.appendChild(slotLetter);

                    // Track correct placement statistic
                    playerProgress.totalCorrectPlacements++;

                    playCorrectSound();
                    checkCompletion();
                } else {
                    // Incorrect
                    mistakes++;
                    mistakesEl.textContent = `⚠ ${mistakes}`;

                    // Track incorrect placement statistic
                    playerProgress.totalIncorrectPlacements++;

                    targetSlot.element.classList.add('incorrect');
                    gameWorld.classList.remove('screen-shake');
                    void gameWorld.offsetWidth;
                    gameWorld.classList.add('screen-shake');
                    setTimeout(() => {
                        targetSlot.element.classList.remove('incorrect');
                        gameWorld.classList.remove('screen-shake');
                    }, 500);

                    playIncorrectSound();
                }
            }

            dragState = null;
        }

        // Touch events
        gameWorld.addEventListener('touchstart', (e) => {
            if (mode === 'edit' || gameComplete) return;
            const touch = e.touches[0];
            const target = e.target.closest('.letter-tile');
            if (!target) return;

            const tileData = tiles.find(t => t.id === parseInt(target.dataset.tileId));
            if (tileData && !tileData.placed) {
                e.preventDefault();
                startDrag(tileData, touch.clientX, touch.clientY);
            }
        }, { passive: false });

        gameWorld.addEventListener('touchmove', (e) => {
            if (!dragState) return;
            e.preventDefault();
            const touch = e.touches[0];
            moveDrag(touch.clientX, touch.clientY);
        }, { passive: false });

        gameWorld.addEventListener('touchend', (e) => {
            if (!dragState) return;
            const touch = e.changedTouches[0];
            endDrag(touch.clientX, touch.clientY);
        });

        // Mouse events
        gameWorld.addEventListener('mousedown', (e) => {
            if (mode === 'edit' || gameComplete) return;
            const target = e.target.closest('.letter-tile');
            if (!target) return;

            const tileData = tiles.find(t => t.id === parseInt(target.dataset.tileId));
            if (tileData && !tileData.placed) {
                startDrag(tileData, e.clientX, e.clientY);
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!dragState) return;
            moveDrag(e.clientX, e.clientY);
        });

        window.addEventListener('mouseup', (e) => {
            if (!dragState) return;
            endDrag(e.clientX, e.clientY);
        });

        // --- Check completion ---
        function checkCompletion() {
            if (slots.every(s => s.correct)) {
                gameComplete = true;
                // Reflow the completed text as one Arabic run so contextual joining,
                // ligatures, and Quranic diacritics remain visually connected.
                showFullyJoinedAyah();
                // Completion fanfare is followed by the complete ayah recitation.

                const stars = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1;
                const verseId = currentVerseData.id || `verse_${playerProgress.currentVerseIndex}`;

                // Update player progress
                if (!playerProgress.completedVerseIds.includes(verseId)) {
                    playerProgress.completedVerseIds.push(verseId);
                    playerProgress.totalVersesCompleted++;
                }
                
                // Update star rating (keep the best)
                const previousStars = playerProgress.starRatings[verseId] || 0;
                if (stars > previousStars) {
                    playerProgress.starRatings[verseId] = stars;
                }

                // Update streak statistics
                if (stars === 3) {
                    // Perfect completion continues the streak
                    playerProgress.currentStreak++;
                    if (playerProgress.currentStreak > playerProgress.bestStreak) {
                        playerProgress.bestStreak = playerProgress.currentStreak;
                    }
                } else {
                    // Non-perfect completion resets the streak
                    playerProgress.currentStreak = 0;
                }

                // Record completion timestamp
                playerProgress.lastCompletedAt = new Date().toISOString();

                // Save progress immediately after completion
                savePlayerProgress();
                updateAchievementButton();
                spawnSuccessParticles();

                // Tell the host page a verse was completed so it can record
                // points/score in Supabase and refresh the live leaderboard.
                // Checked by identity on the receiving end (event.source), not
                // origin, so this keeps working whether the game is served
                // same-origin (public/) or later moved to a CDN/R2 URL.
                try {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({
                            source: 'darasaone-game',
                            gameSlug: 'ayah-quest',
                            // Standard contract for every Darasaone game:
                            // { source: 'darasaone-game', gameSlug, type: 'game-complete', pointsEarned, ...meta }.
                            // The host only ever reads `pointsEarned`; everything
                            // else here is Ayah-Quest-specific metadata for
                            // future features (per-verse stats, etc).
                            type: 'game-complete',
                            verseId,
                            stars,
                            pointsEarned: stars * 10,
                            totalVersesCompleted: playerProgress.totalVersesCompleted,
                            bestStreak: playerProgress.bestStreak
                        }, '*');
                    }
                } catch (error) {
                    lib.log(`Could not notify host page of verse completion: ${error.message}`);
                }

                setTimeout(() => {
                    const isLastVerse = playerProgress.currentVerseIndex >= versesArray.length - 1;
                    const nextBtnText = isLastVerse ? 'Play Again' : 'Next Verse →';
                    
                    successOverlay.innerHTML = `
                        <div class="stars-display">
                            ${[1,2,3].map(i => `<span class="star ${i <= stars ? 'earned' : ''}">⭐</span>`).join('')}
                        </div>
                        <div class="success-text">ما شاء الله!</div>
                        <div class="success-verse">${verseText}</div>
                        <div style="font-size:18px; color:rgba(255,255,255,0.7); margin-bottom:24px; direction:ltr;">${verseRef}</div>
                        <div style="font-size:16px; color:rgba(255,255,255,0.55); margin-bottom:16px; direction:ltr;">
                            ${playerProgress.totalVersesCompleted} verses mastered
                        </div>
                        <div class="completion-actions">
                            <button class="next-btn achievement-overlay-btn" id="view-achievement-btn">🏅 View Achievement</button>
                            <button class="next-btn" id="next-verse-btn">${nextBtnText}</button>
                        </div>
                    `;
                    successOverlay.classList.add('visible');

                    // Animate stars
                    const starEls = successOverlay.querySelectorAll('.star.earned');
                    starEls.forEach((el, i) => {
                        el.style.transitionDelay = (i * 200) + 'ms';
                        el.style.transform = 'scale(1.2)';
                        setTimeout(() => { el.style.transform = 'scale(1)'; }, 300 + i * 200);
                    });

                    const viewAchievementBtn = document.getElementById('view-achievement-btn');
                    if (viewAchievementBtn) {
                        viewAchievementBtn.addEventListener('click', () => {
                            successOverlay.classList.remove('visible');
                            showAchievementCard(true);
                        });
                    }

                    document.getElementById('next-verse-btn').addEventListener('click', () => {
                        successOverlay.classList.remove('visible');
                        
                        if (isLastVerse) {
                            // Reset to first verse
                            playerProgress.currentVerseIndex = 0;
                        } else {
                            // Move to next verse
                            playerProgress.currentVerseIndex++;
                        }
                        
                        // Save after advancing
                        savePlayerProgress();
                        
                        // Load next verse
                        loadNextVerse();
                    });
                }, 600);
            }
        }

        function loadNextVerse() {
            stopRecitation();
            gameComplete = false;
            mistakes = 0;
            mistakesEl.textContent = '⚠ 0';
            
            // Update verse data from progression
            currentVerseData = versesArray[playerProgress.currentVerseIndex] || versesArray[0];
            playerProgress.currentLevel = currentVerseData.difficulty || 'Beginner';
            verseText = currentVerseData.text;
            missingIndices = currentVerseData.missingIndices.slice().sort((a, b) => a - b);
            verseRef = currentVerseData.reference || '';
            chars = splitTextUnits(verseText);
            missingSet = new Set(missingIndices);
            
            // Update header
            const progressInfo = `<div style="font-size:14px; color:rgba(255,255,255,0.65); direction:ltr; margin-top:4px;">
                Verse ${playerProgress.currentVerseIndex + 1} of ${versesArray.length} • 
                ${playerProgress.totalVersesCompleted} completed • 
                ${currentVerseData.difficulty || 'beginner'}
            </div>`;
            
            header.innerHTML = `
                <div class="game-title">DarasaOne: Ayah Quest</div>
                <div class="verse-ref">${verseRef}</div>
                ${mode === 'play' ? progressInfo : ''}
            `;
            // Reattach the persistent audio control after changing verse header content.
            header.appendChild(audioControls);
            
            buildVerse();
            buildTiles();
        }

        function resetGame() {
            stopRecitation();
            gameComplete = false;
            mistakes = 0;
            mistakesEl.textContent = '⚠ 0';
            buildVerse();
            buildTiles();
        }

        // --- Edit mode ---
        if (mode === 'edit') {
            const indicator = document.createElement('div');
            indicator.className = 'edit-indicator';
            indicator.textContent = '✏️ Edit Mode';
            gameWorld.appendChild(indicator);
        }
    }


    run('play');
    </script>
</body>
</html>
